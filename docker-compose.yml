version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      TEST_CASES_DIR: /app/testcases
      FRONTEND_ORIGIN: 'http://localhost:5173'
    volumes:
      - /tmp:/tmp  # For temp uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: 'http://localhost:8080'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
